# Exact-SHA rerun trigger for candidate 2a7670c5166efee54426196f28a8152cbfe758b3 — acceptance steps unchanged.
name: ONE Milestone 1 E1 Cross-Platform Acceptance Lab

on:
  push:
    branches: [verification]
    paths:
      - ".github/workflows/milestone-1-e1-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-e1-acceptance-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  e1:
    name: E1 tests and repository contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout verifier harness
        uses: actions/checkout@v4
      - name: Read pinned canonical revision
        id: source
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < CANONICAL_COMMIT.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout exact canonical ONE revision
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Assert exact source revision
        shell: bash
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"

      - name: Install Linux native cross-compilers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld mingw-w64 binutils-x86-64-linux-gnu
          command -v clang
          command -v x86_64-w64-mingw32-clang || true
          # The candidate passes --target=x86_64-w64-windows-gnu itself; use
          # the installed Clang driver when the distro lacks the named wrapper.
          echo "ONE_WINDOWS_CLANG=$(command -v clang)" >> "$GITHUB_ENV"

      - name: Install Windows native cross-compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $env:Path += ";C:\tools\mingw64\bin;C:\tools\mingw\bin;C:\Program Files\LLVM\bin"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $clang = Get-Command clang -ErrorAction Stop
          "ONE_WINDOWS_CLANG=$($clang.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clang.Source --version
          Get-Command x86_64-w64-mingw32-clang -ErrorAction SilentlyContinue

      - name: Install Android API 35 NDK toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android API 35 clang (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;27.2.12479018" "platforms;android-35"
          clang="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$clang"
          echo "ONE_ANDROID_CLANG=$clang" >> "$GITHUB_ENV"
          "$clang" --version

      - name: Configure Android API 35 clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkmanager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter "sdkmanager.bat" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under ANDROID_HOME\cmdline-tools" }
          & $sdkmanager --licenses | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager --licenses failed: $LASTEXITCODE" }
          & $sdkmanager --install "ndk;27.2.12479018" "platforms;android-35"
          if ($LASTEXITCODE -ne 0) { throw "Android API 35 NDK/platform install failed: $LASTEXITCODE" }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          if (-not (Test-Path $clang)) { throw "Android API 35 clang missing: $clang" }
          "ONE_ANDROID_CLANG=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clang --version
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Print exact evidence context
        shell: bash
        working-directory: source
        run: |
          echo "Source SHA: $(git rev-parse HEAD)"
          rustc --version
          cargo --version
          python --version
      - name: E1 standard-library integration regression suite
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins
      - name: E1 standard-library library unit suite
        working-directory: source
        run: cargo --locked test -p one-core --lib
      - name: Full workspace tests
        working-directory: source
        run: cargo --locked test --workspace --all-targets
      - name: Workspace Clippy with warnings denied
        working-directory: source
        run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - name: Repository contract checker
        working-directory: source
        run: python tools/check_contract.py
      - name: Summarize exact revision and run
        if: always()
        shell: bash
        working-directory: source
        run: |
          {
            echo "## ONE E1 Acceptance Lab"
            echo "- Canonical source SHA: $(git rev-parse HEAD)"
            echo "- OS: $(uname -a)"
            echo "- Rust: $(rustc --version)"
            echo "- Cargo: $(cargo --version)"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
