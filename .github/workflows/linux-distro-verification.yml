# Exact candidate revalidation trigger 2026-10-26; acceptance logic unchanged.
name: ONE Linux Distro Verification
# Exact-SHA revalidation for the current milestone candidate; keep distro evidence pinned to CANONICAL_COMMIT.txt.
# Keep this workflow in sync with the default-branch definition so runs use the latest matrix contract.

on:
  push:
    branches: [ verification ]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/linux-distro-verification.yml'
  pull_request:
    branches: [ verification ]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/linux-distro-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-linux-distro-v2-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical target
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Contract checks
        working-directory: source
        run: python3 tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo --locked build --workspace --all-targets
      - name: Clippy
        working-directory: source
        run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (native distro; target-toolchain cases covered separately)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo --locked test --workspace --all-targets -- --skip windows_x86_64_target_mempertahankan_build_native --skip android_target_explicit_mempertahankan_build_native --skip windows_x86_64_dapat_membangun_artifact_native
      - name: Real network tests (native distro; target-toolchain case covered separately)
        working-directory: source
        shell: bash
        run: cargo --locked test -p one-core --features real-network --all-targets -- --skip windows_x86_64_dapat_membangun_artifact_native

  debian:
    name: Debian 12 container
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    env:
      # GitHub mounts /github/home for the host runner UID; this job executes as
      # root inside Debian, so keep Git/Rust toolchain state in root's writable home.
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - name: Install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential pkg-config clang
      - uses: actions/checkout@v4
      - name: Read canonical target
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Contract checks
        working-directory: source
        run: python3 tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo --locked build --workspace --all-targets
      - name: Clippy
        working-directory: source
        run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (native distro; target-toolchain cases covered separately)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo --locked test --workspace --all-targets -- --skip windows_x86_64_target_mempertahankan_build_native --skip android_target_explicit_mempertahankan_build_native --skip windows_x86_64_dapat_membangun_artifact_native
      - name: Real network tests (native distro; target-toolchain case covered separately)
        working-directory: source
        shell: bash
        run: cargo --locked test -p one-core --features real-network --all-targets -- --skip windows_x86_64_dapat_membangun_artifact_native
