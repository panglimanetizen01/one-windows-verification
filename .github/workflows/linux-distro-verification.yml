name: ONE Linux Distro Verification

on:
  push:
    branches: [ verification ]
  pull_request:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical target
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native target toolchains
        shell: bash
        run: |
          sudo apt-get install -y mingw-w64
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Contract checks
        working-directory: source
        run: python3 tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo build --workspace --all-targets
      - name: Clippy
        working-directory: source
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Real network tests
        working-directory: source
        run: cargo test -p one-core --features real-network --all-targets

  debian:
    name: Debian 12 container
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential pkg-config clang mingw-w64 openjdk-17-jdk
      - uses: actions/checkout@v4
      - name: Read canonical target
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - name: Configure Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Contract checks
        working-directory: source
        run: python3 tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo build --workspace --all-targets
      - name: Clippy
        working-directory: source
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Real network tests
        working-directory: source
        run: cargo test -p one-core --features real-network --all-targets
