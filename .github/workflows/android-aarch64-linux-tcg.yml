name: ONE Android AArch64 runtime — Linux TCG

on:
  push:
    branches: [verification]
    paths:
      - '.github/workflows/android-aarch64-linux-tcg.yml'
      - 'CANONICAL_COMMIT.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aarch64-linux-tcg:
    name: API 35 arm64-v8a ELF runtime on Linux TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact canonical source SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout exact ONE source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and Android API 35 AArch64 system image
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "emulator" "platform-tools" "system-images;android-35;default;arm64-v8a"
          clang="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -path '*/bin/aarch64-linux-android24-clang' -print -quit)"
          test -x "$clang"
          echo "ONE_ANDROID_CLANG=$clang" >> "$GITHUB_ENV"

      - name: Android backend contract tests
        working-directory: source
        run: cargo test --locked -p one-core --test native_backend_android_aarch64

      - name: Boot Android API 35 AArch64 using software emulation
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          devices="$("$avdmanager" list device)"
          device_id="$(printf '%s\n' "$devices" | sed -n 's/.*id: [0-9][0-9]* or "\([^"]*\)".*/\1/p' | grep -m1 '^pixel' || true)"
          test -n "$device_id"
          printf 'no\n' | "$avdmanager" create avd --force --name one-api35-arm64-linux-tcg --package "system-images;android-35;default;arm64-v8a" --device "$device_id"
          log="$RUNNER_TEMP/one-android-linux-tcg.log"
          # Force QEMU's software TCG accelerator through the emulator's QEMU argument boundary;
          # -accel off alone did not establish that the guest was using the intended TCG path.
          "$ANDROID_HOME/emulator/emulator" -feature -HVF -accel off -avd one-api35-arm64-linux-tcg -port 5554 -no-window -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 4096 -cores 2 -gpu swiftshader_indirect -no-metrics -verbose -qemu -accel tcg >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          adb start-server
          booted=0
          for attempt in $(seq 1 360); do
            if ! kill -0 "$pid" 2>/dev/null; then tail -n 250 "$log"; exit 1; fi
            if adb devices | tr -d '\r' | grep -q '^emulator-5554[[:space:]]\+device$'; then
              [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ] && booted=1 && break
            fi
            sleep 10
          done
          if [ "$booted" != "1" ]; then tail -n 300 "$log"; adb devices -l || true; exit 1; fi
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
          test "$(adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
          echo "ONE_ANDROID_ADB=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"

      - name: Build and execute AArch64 ELF on Android
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export ONE_ANDROID_ADB="$ANDROID_HOME/platform-tools/adb"
          "$ONE_ANDROID_CLANG" --version
          cargo --locked test -p one-core --test native_backend_android_aarch64 build_native_menghasilkan_dan_menjalankan_elf_android_aarch64 -- --ignored --exact --nocapture
