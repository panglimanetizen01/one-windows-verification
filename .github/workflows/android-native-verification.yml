name: ONE Android AArch64 Native Runtime Verification (Linux TCG host)
# Android AArch64 guest under Linux-hosted software TCG to avoid unavailable nested HVF/KVM.
# Require actual AArch64 ELF execution on the pinned canonical source SHA.

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/android-native-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-android-runtime-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  android-aarch64-runtime:
    name: Android AArch64 ELF build and execute
    # x86_64 Linux avoids the hosted macOS nested-HVF failure; Android AArch64 executes via explicit software TCG.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4

      - name: Read canonical source SHA
        id: target
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < CANONICAL_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical ONE source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify exact source SHA
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          license_log="$(mktemp)"
          yes_log="$(mktemp)"
          set +e
          yes 2>"$yes_log" | sdkmanager --licenses >"$license_log" 2>&1
          statuses=("${PIPESTATUS[@]}")
          set -e
          license_status="${statuses[1]}"
          yes_status="${statuses[0]}"
          cat "$license_log"
          if (( license_status != 0 )); then
            exit "$license_status"
          fi
          if (( yes_status != 0 && yes_status != 141 )); then
            # macOS reports EPIPE from yes as status 1 rather than 141. Accept
            # that exact case only when sdkmanager confirms license completion.
            if ! (( yes_status == 1 )) || ! grep -Fq "Broken pipe" "$yes_log" || ! grep -Fq "All SDK package licenses accepted" "$license_log"; then
              cat "$yes_log" >&2
              exit "$yes_status"
            fi
          fi
          sdkmanager --install "ndk;27.2.12479018"
          clang="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit)"
          test -n "$clang"
          test -x "$clang"
          echo "ONE_ANDROID_CLANG=$clang" >> "$GITHUB_ENV"

      - name: Boot Android AArch64 emulator with observable diagnostics
        shell: bash
        env:
          ANDROID_I_WANT_MY_TCG: yes
        run: |
          set -euo pipefail
          echo "Host architecture: $(uname -m)"
          echo "Host kernel: $(uname -a)"
          sdkmanager --install "emulator" "platform-tools" "system-images;android-35;google_apis;arm64-v8a"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name one-api35-arm64 --package "system-images;android-35;google_apis;arm64-v8a" --device pixel_2
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          test -x "$emulator_bin"
          log="$RUNNER_TEMP/one-android-emulator.log"
          "$emulator_bin" -avd one-api35-arm64 -port 5554 -no-window -noaudio -no-boot-anim -camera-back none -no-snapshot -gpu swiftshader_indirect -feature -HVF -accel off -verbose >"$log" 2>&1 &
          emulator_pid=$!
          echo "Emulator PID: $emulator_pid"
          echo "Emulator log: $log"
          adb start-server
          booted=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator process exited before boot."
              tail -n 240 "$log" || true
              exit 1
            fi
            devices="$(adb devices | tr -d '\r')"
            echo "Boot poll $attempt/120: $devices"
            if printf '%s\n' "$devices" | grep -q '^emulator-5554[[:space:]]\+device$'; then
              completed="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$completed" = "1" ]; then booted=1; break; fi
            fi
            sleep 15
          done
          if [ "$booted" != "1" ]; then
            echo "Android emulator did not reach sys.boot_completed=1 within 30 minutes."
            tail -n 300 "$log" || true
            adb devices -l || true
            exit 1
          fi
          adb -s emulator-5554 shell getprop ro.build.version.sdk
          adb -s emulator-5554 shell getprop ro.product.cpu.abi
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
          test "$(adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
          echo "ONE_ANDROID_ADB=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"

      - name: Build and execute ELF AArch64 on Android emulator
        shell: bash
        working-directory: source
        env:
          ANDROID_I_WANT_MY_TCG: yes
          ONE_ANDROID_ADB: ${{ env.ONE_ANDROID_ADB }}
        run: |
          set -euo pipefail
          export ONE_ANDROID_ADB="$ANDROID_HOME/platform-tools/adb"
          uname -a
          "$ONE_ANDROID_CLANG" --version
          adb devices
          cargo --locked test -p one-core --test native_backend_android_aarch64 build_native_menghasilkan_dan_menjalankan_elf_android_aarch64 -- --ignored --exact --nocapture
