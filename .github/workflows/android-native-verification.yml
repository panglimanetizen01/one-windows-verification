name: ONE Android AArch64 Native Runtime Verification (macOS HVF capability probe)
# Probe native macOS Hypervisor.Framework on the hosted ARM64 runner; fail with retained diagnostics if nested virtualization is unavailable.
# Require actual AArch64 ELF execution on the pinned canonical source SHA.

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/android-native-verification.yml'
  pull_request:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/android-native-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-android-runtime-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  android-aarch64-runtime:
    name: Android AArch64 ELF build and execute
    # Native Apple Silicon host: test whether this hosted VM actually exposes Hypervisor.Framework to the Android emulator.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4

      - name: Read canonical source SHA
        id: target
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < CANONICAL_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical ONE source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify exact source SHA
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          license_log="$RUNNER_TEMP/one-android-license.log"
          yes_log="$RUNNER_TEMP/one-android-license-yes.log"
          set +e
          yes 2>"$yes_log" | sdkmanager --licenses >"$license_log" 2>&1
          statuses=("${PIPESTATUS[@]}")
          set -e
          license_status="${statuses[1]}"
          yes_status="${statuses[0]}"
          cat "$license_log"
          if (( license_status != 0 )); then
            cat "$yes_log" >&2 || true
            exit "$license_status"
          fi
          if (( yes_status != 0 && yes_status != 141 )); then
            # macOS reports EPIPE from yes as status 1 rather than 141. Accept
            # that exact case only when sdkmanager confirms license completion.
            if ! (( yes_status == 1 )) || ! grep -Fq "Broken pipe" "$yes_log" || ! grep -Fq "All SDK package licenses accepted" "$license_log"; then
              cat "$yes_log" >&2
              exit "$yes_status"
            fi
          fi
          ndk_log="$RUNNER_TEMP/one-android-ndk-install.log"
          set +e
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=1080, check=True)' sdkmanager --verbose --install "ndk;27.2.12479018" 2>&1 | tee "$ndk_log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          ndk_status="${statuses[0]}"
          tee_status="${statuses[1]}"
          if (( ndk_status != 0 )); then
            echo "Android NDK installation failed or exceeded its 18-minute limit (exit $ndk_status)." >&2
            tail -n 240 "$ndk_log" >&2 || true
            exit "$ndk_status"
          fi
          if (( tee_status != 0 )); then exit "$tee_status"; fi
          clang="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit)"
          test -n "$clang"
          test -x "$clang"
          echo "ONE_ANDROID_CLANG=$clang" >> "$GITHUB_ENV"

      - name: Install Android API 35 emulator image with bounded diagnostics
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          echo "Host architecture: $(uname -m)"
          echo "Host kernel: $(uname -a)"
          log="$RUNNER_TEMP/one-android-sdkmanager.log"
          set +e
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=1080, check=True)' sdkmanager --verbose --install "emulator" "platform-tools" "system-images;android-35;default;arm64-v8a" 2>&1 | tee "$log"
          statuses=( "${PIPESTATUS[@]}" )
          set -e
          sdk_status="${statuses[0]}"
          tee_status="${statuses[1]}"
          if (( sdk_status != 0 )); then
            echo "sdkmanager failed or exceeded its 18-minute limit (exit $sdk_status)." >&2
            tail -n 240 "$log" >&2 || true
            exit "$sdk_status"
          fi
          if (( tee_status != 0 )); then exit "$tee_status"; fi

      - name: Run Android backend contract tests before emulator capability probe
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p one-core --test native_backend_android_aarch64

      - name: Boot Android AArch64 emulator with observable diagnostics
        timeout-minutes: 35
        shell: bash
        env:
          ONE_ANDROID_ALLOW_HVF: yes
        run: |
          set -euo pipefail
          echo "Host architecture: $(uname -m)"
          echo "Host kernel: $(uname -a)"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          device_list="$("$avdmanager" list device)"
          printf '%s\n' "$device_list"
          device_id="$(printf '%s\n' "$device_list" | sed -n 's/.*id: [0-9][0-9]* or "\([^"]*\)".*/\1/p' | grep -m1 '^pixel' || true)"
          if [ -z "$device_id" ]; then
            device_id="$(printf '%s\n' "$device_list" | sed -n 's/.*id: [0-9][0-9]* or "\([^"]*\)".*/\1/p' | head -n 1)"
          fi
          test -n "$device_id"
          echo "Selected installed AVD device profile: $device_id"
          printf 'no\n' | "$avdmanager" create avd --force --name one-api35-arm64 --package "system-images;android-35;default;arm64-v8a" --device "$device_id"
          test -f "$ANDROID_AVD_HOME/one-api35-arm64.ini"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          test -x "$emulator_bin"
          log="$RUNNER_TEMP/one-android-emulator.log"
          # Do not force TCG or disable HVF here: Android's AArch64 guest requires VM acceleration.
          # This is a direct capability probe for nested Hypervisor.Framework on the hosted runner.
          "$emulator_bin" -avd one-api35-arm64 -port 5554 -no-window -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 3072 -cores 4 -gpu swiftshader_indirect -verbose >"$log" 2>&1 &
          emulator_pid=$!
          echo "Emulator PID: $emulator_pid"
          echo "Emulator log: $log"
          adb start-server
          booted=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator process exited before boot."
              tail -n 240 "$log" || true
              exit 1
            fi
            devices="$(adb devices | tr -d '\r')"
            echo "Boot poll $attempt/120: $devices"
            if printf '%s\n' "$devices" | grep -q '^emulator-5554[[:space:]]\+device$'; then
              completed="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$completed" = "1" ]; then booted=1; break; fi
            fi
            sleep 15
          done
          if [ "$booted" != "1" ]; then
            echo "Android emulator did not reach sys.boot_completed=1 within 30 minutes."
            tail -n 300 "$log" || true
            adb devices -l || true
            exit 1
          fi
          adb -s emulator-5554 shell getprop ro.build.version.sdk
          adb -s emulator-5554 shell getprop ro.product.cpu.abi
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
          test "$(adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
          echo "ONE_ANDROID_ADB=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"

      - name: Build and execute ELF AArch64 on Android emulator
        shell: bash
        working-directory: source
        env:
          ONE_ANDROID_ADB: ${{ env.ONE_ANDROID_ADB }}
        run: |
          set -euo pipefail
          export ONE_ANDROID_ADB="$ANDROID_HOME/platform-tools/adb"
          uname -a
          "$ONE_ANDROID_CLANG" --version
          adb devices
          cargo --locked test -p one-core --test native_backend_android_aarch64 build_native_menghasilkan_dan_menjalankan_elf_android_aarch64 -- --ignored --exact --nocapture
