name: Diagnostic probe workflow trigger smoke

on:
  push:
    branches:
      - 'probe/**'

permissions:
  contents: read

jobs:
  trigger-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow scheduling
        run: |
          echo "workflow_trigger_smoke=OK"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
