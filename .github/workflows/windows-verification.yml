name: One Exact-SHA CI Parity Verification

on:
  push:
    branches: [verification]
    paths:
      - 'ONE_SOURCE_CANONICAL_COMMIT.txt'
      - 'CI_LOCAL_CANONICAL_COMMIT.txt'
      - 'plans/one-product-checks.json'
      - '.github/workflows/windows-verification.yml'
  pull_request:
    branches: [verification]
    paths:
      - 'ONE_SOURCE_CANONICAL_COMMIT.txt'
      - 'CI_LOCAL_CANONICAL_COMMIT.txt'
      - 'plans/one-product-checks.json'
      - '.github/workflows/windows-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-parity-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read and validate independent source pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          one_sha="$(tr -d '\r\n[:space:]' < ONE_SOURCE_CANONICAL_COMMIT.txt)"
          ci_local_sha="$(tr -d '\r\n[:space:]' < CI_LOCAL_CANONICAL_COMMIT.txt)"
          for item in "$one_sha" "$ci_local_sha"; do
            if ! printf '%s' "$item" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Invalid canonical commit: $item" >&2
              exit 1
            fi
          done
          echo "one=$one_sha" >> "$GITHUB_OUTPUT"
          echo "ci_local=$ci_local_sha" >> "$GITHUB_OUTPUT"

      - name: Verify read access to pinned private ci-local repository
        shell: bash
        env:
          CI_LOCAL_READ_TOKEN: ${{ secrets.CI_LOCAL_READ_TOKEN || secrets.CANONICAL_READ_TOKEN }}
          CI_LOCAL_SHA: ${{ steps.pins.outputs.ci_local }}
        run: |
          set -euo pipefail
          if [ -z "$CI_LOCAL_READ_TOKEN" ]; then
            echo "Missing CI_LOCAL_READ_TOKEN (or fallback CANONICAL_READ_TOKEN)." >&2
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CI_LOCAL_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/panglimanetizen01/ci-local/commits/$CI_LOCAL_SHA")"
          echo "Pinned private ci-local commit API status: $status"
          if [ "$status" != "200" ]; then
            echo "The configured token must have Contents: read access to panglimanetizen01/ci-local." >&2
            exit 1
          fi

      - name: Checkout canonical ONE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.pins.outputs.one }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Checkout standalone ci-local
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/ci-local
          ref: ${{ steps.pins.outputs.ci_local }}
          token: ${{ secrets.CI_LOCAL_READ_TOKEN || secrets.CANONICAL_READ_TOKEN }}
          path: ci-local

      - name: Verify all three repository identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C source rev-parse HEAD)" = "${{ steps.pins.outputs.one }}"
          test "$(git -C ci-local rev-parse HEAD)" = "${{ steps.pins.outputs.ci_local }}"
          printf 'verifier_sha=%s\none_source_sha=%s\nci_local_sha=%s\n' \
            "${{ github.sha }}" "${{ steps.pins.outputs.one }}" "${{ steps.pins.outputs.ci_local }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Provision Ubuntu native cross-target toolchains
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          echo "Runner-provided Clang:"
          command -v clang
          clang --version
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          timeout --signal=TERM --kill-after=30s 10m sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          timeout --signal=TERM --kill-after=30s 15m sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev gcc-mingw-w64-x86-64-posix
          command -v x86_64-w64-mingw32-ld
          mingw_gcc="$(command -v x86_64-w64-mingw32-gcc-posix)"
          mingw_libgcc="$("$mingw_gcc" -print-file-name=libgcc.a)"
          test -f "$mingw_libgcc"
          echo "MinGW GCC runtime verified: $mingw_libgcc"
          echo "ONE_WINDOWS_CLANG=$(command -v clang)" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=30s 30m sdkmanager --install "ndk;27.2.12479018"
          ndk_root="$ANDROID_HOME/ndk/27.2.12479018"
          android_clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$android_clang"
          echo "Android NDK selected: $ndk_root"
          echo "ONE_ANDROID_CLANG=$android_clang" >> "$GITHUB_ENV"

      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        timeout-minutes: 35
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        timeout-minutes: 45
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkmanager --install "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV

      - name: Compile standalone ci-local package and tests
        working-directory: ci-local
        shell: bash
        run: |
          python -m compileall -q ci_local tests
          python -m unittest discover -s tests -v

      - name: Build and install pinned ci-local distribution
        shell: bash
        run: python -m pip install --no-deps ./ci-local

      - name: Verify installed package origin and console entry points
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import ci_local

          checkout = (Path(os.environ["GITHUB_WORKSPACE"]) / "ci-local").resolve()
          installed = Path(ci_local.__file__).resolve()
          if installed == checkout or checkout in installed.parents:
              raise SystemExit(f"ci_local import shadowed by checkout: {installed}")
          print(f"installed ci_local origin: {installed}")
          PY
          ci-local --help
          ci-local-evidence --help

      - name: Run installed-package smoke plan
        shell: bash
        run: |
          ci-local \
            --plan "$GITHUB_WORKSPACE/ci-local/examples/smoke-plan.json" \
            --cwd "$GITHUB_WORKSPACE/ci-local" \
            --report "$RUNNER_TEMP/ci-local-smoke-report.json"

      - name: Run ONE product verification plan through standalone runner
        shell: bash
        run: |
          ci-local \
            --plan "$GITHUB_WORKSPACE/plans/one-product-checks.json" \
            --cwd "$GITHUB_WORKSPACE/source" \
            --report "$RUNNER_TEMP/one-product-report.json"

      - name: Create and verify exact three-identity evidence manifest
        if: always()
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.pins.outputs.one }}
          EXPECTED_RUNNER_SHA: ${{ steps.pins.outputs.ci_local }}
          EXPECTED_VERIFIER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        run: |
          if ! command -v ci-local-evidence >/dev/null 2>&1 || [ ! -f "$RUNNER_TEMP/one-product-report.json" ]; then
            echo "::notice::Evidence creation skipped because the standalone runner did not install or the product report was not produced."
            exit 0
          fi
          ci-local-evidence create \
            --report "$RUNNER_TEMP/one-product-report.json" \
            --plan "$GITHUB_WORKSPACE/plans/one-product-checks.json" \
            --manifest "$RUNNER_TEMP/one-product-manifest.json" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-verifier-sha "$EXPECTED_VERIFIER_SHA" \
            --expected-runner-sha "$EXPECTED_RUNNER_SHA" \
            --run-id "$RUN_ID"
          ci-local-evidence verify \
            --report "$RUNNER_TEMP/one-product-report.json" \
            --plan "$GITHUB_WORKSPACE/plans/one-product-checks.json" \
            --manifest "$RUNNER_TEMP/one-product-manifest.json" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-verifier-sha "$EXPECTED_VERIFIER_SHA" \
            --expected-runner-sha "$EXPECTED_RUNNER_SHA"

      - name: Upload standalone ci-local and ONE verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-local-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ci-local-smoke-report.json
            ${{ runner.temp }}/one-product-report.json
            ${{ runner.temp }}/one-product-manifest.json
            plans/one-product-checks.json
          if-no-files-found: warn
