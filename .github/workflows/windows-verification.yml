name: One Exact-SHA CI Parity Verification

on:
  push:
    branches: [ verification ]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  pull_request:
    branches: [ verification ]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-parity-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical One source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify checked-out source SHA (Linux)
        if: runner.os != 'Windows'
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"

      - name: Verify checked-out source SHA (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ steps.canonical.outputs.ref }}') { throw "Canonical commit mismatch: $actual" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install cross-compilers (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mingw-w64
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"

      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkmanager --install "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV

      - name: Toolchain
        working-directory: source
        run: rustc --version && cargo --version

      - name: Contract artifacts
        working-directory: source
        run: python tools/check_contract.py

      - name: Build
        working-directory: source
        run: cargo build --workspace --all-targets

      - name: Clippy
        working-directory: source
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        working-directory: source
        run: cargo test --workspace --all-targets

      - name: Deterministic .oneir and .onepkg artifacts
        working-directory: source
        run: cargo test -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic

      - name: DNS success and failure classification
        working-directory: source
        run: cargo test -p one-core --all-targets dns_adapter

      - name: Orchestration policy deny and allow paths
        working-directory: source
        run: cargo test -p one-core --all-targets orchestrator

      - name: Database vertical slice
        working-directory: source
        run: cargo test -p one-core --test database_vertical_slice

      - name: HTTP GET vertical slice
        working-directory: source
        run: cargo test -p one-core --test http_get_vertical_slice

      - name: HTTP GET CLI vertical slice
        working-directory: source
        run: cargo test -p one-cli --test http_get_orchestration
