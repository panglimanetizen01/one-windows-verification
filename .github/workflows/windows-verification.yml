name: One Exact-SHA CI Parity Verification

on:
  push:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  pull_request:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-parity-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < LOCAL_CI_CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical One source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify checked-out source SHA (Linux)
        if: runner.os != 'Windows'
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"

      - name: Verify checked-out source SHA (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ steps.canonical.outputs.ref }}') { throw "Canonical commit mismatch: $actual" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install cross-compilers (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mingw-w64
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"

      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkmanager --install "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV

      - name: Show Python version
        working-directory: source
        run: python --version

      - name: Test local CI runner
        working-directory: source
        run: python -m unittest discover -s tests -p test_ci_local.py

      - name: Run local CI parity runner
        working-directory: source
        run: python tools/ci_local.py --report artifacts/ci-local-report.json --timeout 3600

      - name: Validate exact-SHA Local CI report and create SHA-256 manifest
        if: always()
        working-directory: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.canonical.outputs.ref }}
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tempfile

          report_path = pathlib.Path("artifacts/ci-local-report.json")
          manifest_path = pathlib.Path("artifacts/ci-local-manifest.json")
          report_bytes = report_path.read_bytes() if report_path.is_file() else b""
          manifest = {
              "schema_version": 1,
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "verifier_sha": os.environ["VERIFIER_SHA"],
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "job": os.environ.get("GITHUB_JOB"),
              "os": os.environ.get("RUNNER_OS"),
              "arch": os.environ.get("RUNNER_ARCH"),
              "report_file": str(report_path),
              "report_size_bytes": len(report_bytes),
              "report_sha256": hashlib.sha256(report_bytes).hexdigest() if report_bytes else None,
              "validation_status": "NOT_VERIFIED",
          }
          try:
              payload = json.loads(report_bytes)
              manifest["report_schema_version"] = payload.get("schema_version")
              manifest["report_status"] = payload.get("status")
              manifest["report_source_sha"] = payload.get("source_revision", {}).get("commit_sha")
              manifest["worktree_after_clean"] = payload.get("worktree_after", {}).get("working_tree_clean")
              manifest["validation_status"] = "REPORT_PARSED"
          except (UnicodeDecodeError, json.JSONDecodeError):
              manifest["validation_status"] = "INVALID_JSON" if report_bytes else "MISSING_REPORT"
              payload = None

          manifest_path.parent.mkdir(parents=True, exist_ok=True)

          def persist_manifest():
              temporary = None
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w", encoding="utf-8", dir=manifest_path.parent,
                      prefix=".ci-local-manifest.", suffix=".tmp", delete=False
                  ) as stream:
                      temporary = pathlib.Path(stream.name)
                      stream.write(json.dumps(manifest, indent=2) + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(temporary, manifest_path)
                  temporary = None
              finally:
                  if temporary is not None:
                      temporary.unlink(missing_ok=True)

          persist_manifest()
          if payload is None:
              raise SystemExit(f"Local CI report {manifest['validation_status'].lower()}")
          before = payload["source_revision"]
          after = payload["worktree_after"]
          assert payload["schema_version"] == 2, "unexpected report schema"
          assert payload["status"] == "PASS" and payload["exit_code"] == 0, "Local CI did not PASS"
          assert before["status"] == "VERIFIED" and before["commit_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert before["working_tree_clean"] is True, "pre-run worktree is not clean"
          assert after["status"] == "VERIFIED" and after["commit_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert after["working_tree_clean"] is True, "post-check worktree is not clean"
          assert payload["summary"] == {"total": 12, "passed": 12, "failed_or_unavailable": 0}
          manifest["validation_status"] = "PASS"
          persist_manifest()
          manifest_roundtrip = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest_roundtrip["source_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert manifest_roundtrip["report_sha256"] == manifest["report_sha256"]
          assert manifest_roundtrip["validation_status"] == "PASS"
          print("Exact-SHA Local CI report, pre/post worktree, 12/12 summary and SHA-256 manifest PASS")
          PY

      - name: Upload local CI report and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ci-evidence-${{ matrix.os }}
          path: |
            source/artifacts/ci-local-report.json
            source/artifacts/ci-local-manifest.json
          if-no-files-found: error
