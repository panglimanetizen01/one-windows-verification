name: One Cross-Platform Verification

on:
  push:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical One source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: 163744a15a7c3d4e59f325385116fc0d5bdf6834
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify canonical target
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "163744a15a7c3d4e59f325385116fc0d5bdf6834"
      - name: Verify canonical target (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '163744a15a7c3d4e59f325385116fc0d5bdf6834') { throw "canonical commit mismatch: $actual" }
      - name: Toolchain
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Toolchain (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Contract artifacts
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: python3 tools/check_contract.py
      - name: Contract artifacts (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: python tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo build --workspace --all-targets
      - name: Clippy
        working-directory: source
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Offline verification
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: bash tools/verify_offline.sh
      - name: Offline verification (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: .\tools\verify_offline.ps1

# Verification is pinned to the canonical One commit above.
