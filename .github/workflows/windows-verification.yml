name: One Cross-Platform Verification

on:
  push:
    branches: [ verification ]
  pull_request:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical One source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: 86d591c52cf263b38343da51870de309b5a23681
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify canonical target
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: test "$(git rev-parse HEAD)" = "86d591c52cf263b38343da51870de309b5a23681"
      - name: Verify canonical target (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '86d591c52cf263b38343da51870de309b5a23681') { throw "canonical commit mismatch: $actual" }
      - name: Toolchain
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: rustc --version && cargo --version && python3 --version
      - name: Toolchain (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: rustc --version; cargo --version; python --version
      - name: Contract artifacts
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: python3 tools/check_contract.py
      - name: Contract artifacts (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: python tools/check_contract.py
      - name: Build
        working-directory: source
        run: cargo build --workspace --all-targets
      - name: Clippy
        working-directory: source
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Real network runtime tests
        working-directory: source
        shell: bash
        run: cargo test -p one-core --features real-network --lib --all-targets
      - name: Offline verification
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: bash tools/verify_offline.sh
      - name: Offline verification (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: .\tools\verify_offline.ps1

# Verification is pinned to the HTTP/2 runtime candidate checkpoint.
