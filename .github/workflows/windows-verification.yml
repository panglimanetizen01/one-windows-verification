name: One Cross-Platform Verification

on:
  push:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical One source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: bdff53398b0c5995b1822491a29deb2729416043
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify canonical target
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "bdff53398b0c5995b1822491a29deb2729416043"
      - name: Verify canonical target (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne 'bdff53398b0c5995b1822491a29deb2729416043') { throw "canonical commit mismatch: $actual" }
      - name: Toolchain
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Toolchain (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Contract artifacts
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: python3 tools/check_contract.py
      - name: Contract artifacts (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: python tools/check_contract.py
      - name: Build with diagnostic capture
        working-directory: source
        shell: bash
        run: |
          set +e
          cargo build --workspace --all-targets > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.os }}
          path: source/build.log
      - name: Clippy with diagnostic capture
        working-directory: source
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1
          status=$?
          cat clippy.log
          exit $status
      - name: Upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ matrix.os }}
          path: source/clippy.log
      - name: Tests
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Real network runtime tests
        working-directory: source
        shell: bash
        run: cargo test -p one-core --features real-network --lib --all-targets
      - name: Offline verification
        working-directory: source
        shell: bash
        if: runner.os != 'Windows'
        run: bash tools/verify_offline.sh
      - name: Offline verification (Windows)
        working-directory: source
        shell: pwsh
        if: runner.os == 'Windows'
        run: .\tools\verify_offline.ps1

# Verification is pinned to the canonical One Network runtime checkpoint.
