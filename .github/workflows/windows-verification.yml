name: One Exact-SHA CI Parity Verification

on:
  push:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  pull_request:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-parity-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < LOCAL_CI_CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical One source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify checked-out source SHA (Linux)
        if: runner.os != 'Windows'
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"

      - name: Verify checked-out source SHA (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ steps.canonical.outputs.ref }}') { throw "Canonical commit mismatch: $actual" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install cross-compilers (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mingw-w64
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"

      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkmanager --install "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV

      - name: Show Python version
        working-directory: source
        run: python --version

      - name: Test Local CI runner regression suite
        working-directory: source
        run: python tools/ci_unittest.py --start-directory tests --pattern test_ci_local.py

      - name: Test CircleCI configuration paths
        working-directory: source
        run: python tools/ci_unittest.py --start-directory tests --pattern test_circleci_config_paths.py

      - name: Test fail-closed unittest discovery
        working-directory: source
        run: python tools/ci_unittest.py --start-directory tests --pattern test_ci_unittest.py

      - name: Run local CI parity runner
        working-directory: source
        run: python tools/ci_local.py --report artifacts/ci-local-report.json --timeout 3600

      - name: Validate exact-SHA Local CI report and create SHA-256 manifest
        if: always()
        working-directory: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.canonical.outputs.ref }}
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          python tools/ci_local_evidence.py create \
            --report artifacts/ci-local-report.json \
            --manifest artifacts/ci-local-manifest.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --verifier-sha "$VERIFIER_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" \
            --os "$RUNNER_OS" \
            --arch "$RUNNER_ARCH"
          python tools/ci_local_evidence.py verify \
            --report artifacts/ci-local-report.json \
            --manifest artifacts/ci-local-manifest.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-verifier-sha "$VERIFIER_SHA"
      - name: Upload local CI report and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ci-evidence-${{ matrix.os }}
          path: |
            source/artifacts/ci-local-report.json
            source/artifacts/ci-local-manifest.json
          if-no-files-found: error
