# Exact-SHA parity refresh for source candidate 56ef8babfbc35808d82b930d8dd9baa92afb26af
name: One Exact-SHA CI Parity Verification

on:
  push:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  pull_request:
    branches: [ verification ]
    paths:
      - 'LOCAL_CI_CANONICAL_COMMIT.txt'
      - '.github/workflows/windows-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-parity-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < LOCAL_CI_CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical One source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify checked-out source SHA (Linux)
        if: runner.os != 'Windows'
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"

      - name: Verify checked-out source SHA (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ steps.canonical.outputs.ref }}') { throw "Canonical commit mismatch: $actual" }

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Provision Ubuntu native cross-target toolchains
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          echo "Runner-provided Clang:"
          command -v clang
          clang --version
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\\.archive\\.ubuntu\\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          timeout --signal=TERM --kill-after=30s 10m sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          timeout --signal=TERM --kill-after=30s 15m sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev gcc-mingw-w64-x86-64-posix
          command -v x86_64-w64-mingw32-ld
          mingw_gcc="$(command -v x86_64-w64-mingw32-gcc-posix)"
          mingw_libgcc="$("$mingw_gcc" -print-file-name=libgcc.a)"
          test -f "$mingw_libgcc"
          echo "MinGW GCC runtime verified: $mingw_libgcc"
          echo "ONE_WINDOWS_CLANG=$(command -v clang)" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=30s 30m sdkmanager --install "ndk;27.2.12479018"
          ndk_root="$ANDROID_HOME/ndk/27.2.12479018"
          android_clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$android_clang"
          echo "Android NDK selected: $ndk_root"
          echo "ONE_ANDROID_CLANG=$android_clang" >> "$GITHUB_ENV"

      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        timeout-minutes: 35
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        timeout-minutes: 45
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkmanager --install "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV

      - name: Toolchain
        working-directory: source
        run: rustc --version && cargo --version && python --version

      - name: Contract and user documentation checks
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_contract.py
          python tools/check_user_docs.py
          python tools/check_user_docs_test.py

      - name: Build workspace
        working-directory: source
        run: cargo --locked build --workspace --all-targets

      - name: Clippy workspace
        working-directory: source
        run: cargo --locked clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests (Linux)
        if: runner.os != 'Windows'
        working-directory: source
        run: cargo --locked test --workspace --all-targets

      - name: Workspace tests (Windows; Android target covered separately)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          cargo --locked test --workspace --all-targets -- --skip android_target_explicit_mempertahankan_build_native --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
