name: One Windows Verification

on:
  push:
    branches: [ verification ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verification:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical One source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: 69c4918e6845fdbbd79495b3fa2c59798831bce0
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify canonical target
        shell: pwsh
        working-directory: source
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '69c4918e6845fdbbd79495b3fa2c59798831bce0') { throw "canonical commit mismatch: $actual" }
      - name: Toolchain
        shell: pwsh
        working-directory: source
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Contract artifacts
        shell: pwsh
        working-directory: source
        run: python tools/check_contract.py
      - name: Build
        shell: pwsh
        working-directory: source
        run: cargo build --workspace --all-targets
      - name: Clippy
        shell: pwsh
        working-directory: source
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: pwsh
        working-directory: source
        run: cargo test --workspace --all-targets
      - name: Offline verification
        shell: pwsh
        working-directory: source
        run: .\tools\verify_offline.ps1

# Verification is pinned to the canonical One commit above.
