name: E4 SEC-05 subprocess timeout and output-limit verification

on:
  push:
    branches: [verification]
    paths:
      - '.github/workflows/e4-sec05-subprocess-cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subprocess-linux:
    name: Linux subprocess baseline and SEC-05 guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: bdf18288be339524f5fac7fc5740a0f691f64527
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Install Linux native cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld mingw-w64
          command -v clang
          command -v x86_64-w64-mingw32-clang || true
          command -v x86_64-w64-mingw32-gcc || true
          command -v x86_64-w64-mingw32-ld || true
      - name: Configure Windows-target compiler on Linux
        run: echo 'ONE_WINDOWS_CLANG=clang' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact candidate and toolchain
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bdf18288be339524f5fac7fc5740a0f691f64527"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
          rustc --version
          cargo --version
          uname -a
      - name: Run existing subprocess contract tests
        working-directory: source
        run: cargo test --locked -p one-core interop::tests -- --nocapture
      - name: Run complete one-core test suite
        working-directory: source
        run: cargo test --locked -p one-core
      - name: Check formatting for changed subprocess implementation
        if: always()
        working-directory: source
        run: rustfmt --edition 2024 --check crates/one-core/src/interop.rs
      - name: Fail closed unless subprocess timeout and bounded capture are implemented
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          file=crates/one-core/src/interop.rs
          if grep -Fq 'command.output()' "$file"; then
            echo "::error file=crates/one-core/src/interop.rs::SEC-05 FAIL: Command::output() buffers unbounded stdout/stderr and has no execution deadline."
            exit 1
          fi
          grep -Eq 'MAX_.*(OUTPUT|STDOUT|STDERR)|ProcessExecutionPolicy|ProcessLimits' "$file"
          grep -Eq 'try_wait|wait_timeout|deadline|timeout' "$file"
          echo "Static SEC-05 markers found; dynamic timeout/flood tests ran in interop::tests."

  subprocess-windows:
    name: Windows subprocess baseline and SEC-05 guard
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Install Windows LLVM and MinGW toolchains
        shell: pwsh
        run: |
          choco install llvm mingw -y --no-progress
          $env:Path += ";C:\Program Files\LLVM\bin;C:\tools\mingw64\bin;C:\tools\mingw\bin"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $clang = Get-Command clang.exe -ErrorAction Stop
          "ONE_WINDOWS_CLANG=$($clang.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Command clang.exe
          Get-Command x86_64-w64-mingw32-clang.exe -ErrorAction SilentlyContinue
          Get-Command x86_64-w64-mingw32-gcc.exe -ErrorAction SilentlyContinue
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: bdf18288be339524f5fac7fc5740a0f691f64527
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact candidate and toolchain
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "bdf18288be339524f5fac7fc5740a0f691f64527") { throw "Unexpected source SHA: $actual" }
          Write-Output "source_sha=$actual"
          rustc --version
          cargo --version
          Get-ComputerInfo | Select-Object OsName, OsVersion
      - name: Run existing subprocess contract tests
        working-directory: source
        run: cargo test --locked -p one-core interop::tests -- --nocapture
      - name: Run complete one-core test suite
        working-directory: source
        run: cargo test --locked -p one-core
      - name: Check formatting for changed subprocess implementation
        if: always()
        working-directory: source
        run: rustfmt --edition 2024 --check crates/one-core/src/interop.rs
      - name: Fail closed unless subprocess timeout and bounded capture are implemented
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          $file = "crates/one-core/src/interop.rs"
          $sourceText = Get-Content $file -Raw
          if ($sourceText.Contains("command.output()")) {
            Write-Error "SEC-05 FAIL: Command::output() buffers unbounded stdout/stderr and has no execution deadline."
            exit 1
          }
          if ($sourceText -notmatch "MAX_.*(OUTPUT|STDOUT|STDERR)|ProcessExecutionPolicy|ProcessLimits") {
            throw "SEC-05 FAIL: no explicit output-limit policy markers found."
          }
          if ($sourceText -notmatch "try_wait|wait_timeout|deadline|timeout") {
            throw "SEC-05 FAIL: no execution-deadline enforcement markers found."
          }
          Write-Output "Static SEC-05 markers found; adversarial timeout/flood/cleanup tests are still required."
