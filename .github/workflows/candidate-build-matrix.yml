name: ONE Candidate Build Matrix (non-acceptance)

on:
  push:
    branches: [verification]
    paths:
      - 'CANDIDATE_BUILD_COMMIT.txt'
      - '.github/workflows/candidate-build-matrix.yml'
      - 'tests/test_candidate_build_pin.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-one-core:
    name: Linux one-core compile and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate candidate build pin
        run: python -m unittest discover -s tests -p 'test_candidate_build_pin.py' -v
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANDIDATE_BUILD_COMMIT.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: one-source
      - name: Verify source identity
        working-directory: one-source
        shell: bash
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ONE_CANDIDATE_SHA"
          rustc --version
          cargo --version
          printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      - name: Install minimal x86_64 MinGW toolchain for Windows backend contract test
        shell: bash
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300)
          for attempt in 1 2 3; do
            if timeout 4m sudo apt-get "${apt_opts[@]}" update; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "apt-get update failed after 3 bounded attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          timeout 15m sudo apt-get "${apt_opts[@]}" install --no-install-recommends -y clang-18 gcc-mingw-w64-x86-64-posix
          windows_clang="$(command -v clang-18)"
          echo "ONE_WINDOWS_CLANG=$windows_clang" >> "$GITHUB_ENV"
          "$windows_clang" --version
          x86_64-w64-mingw32-gcc-posix --version

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          printf '#include <windows.h>\nint main(void) { return 0; }\n' > "$smoke_dir/mingw-smoke.c"
          "$windows_clang" --target=x86_64-w64-windows-gnu "$smoke_dir/mingw-smoke.c" -o "$smoke_dir/mingw-smoke.exe"
          file "$smoke_dir/mingw-smoke.exe"
      - name: Run full one-core test suite
        working-directory: one-source
        shell: bash
        run: cargo test --locked -p one-core -- --nocapture

  windows-one-core:
    name: Windows one-core compile and tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANDIDATE_BUILD_COMMIT.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: one-source
      - name: Verify source identity
        working-directory: one-source
        shell: pwsh
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:ONE_CANDIDATE_SHA) { throw "Unexpected source SHA: $actual" }
          rustc --version
          cargo --version
          Write-Output "candidate_sha=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      - name: Install Windows GNU cross toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-lld
      - name: Configure Windows native compiler override
        shell: pwsh
        run: |
          "ONE_WINDOWS_CLANG=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          clang --version
      - name: Run full one-core test suite
        working-directory: one-source
        shell: pwsh
        run: |
          cargo test --locked -p one-core -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
