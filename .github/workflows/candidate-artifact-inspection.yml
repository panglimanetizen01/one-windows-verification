name: ONE Candidate Artifact Integrity Verification

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/candidate-artifact-inspection.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect-candidate-bundles:
    name: Inspect exact-SHA Linux and Windows candidate bundles
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verification harness and read source pin
        uses: actions/checkout@v4
      - name: Discover exact-SHA candidate bundles and verify archive digests
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid canonical source SHA: $SOURCE_SHA" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          export SOURCE_SHA
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request

          owner_repo = "panglimanetizen01/one-windows-verification"
          token = os.environ["GH_TOKEN"]
          source_sha = os.environ["SOURCE_SHA"]
          root = pathlib.Path("downloads")
          root.mkdir(exist_ok=True)

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "one-candidate-artifact-integrity",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def pin_for(mirror_sha):
              url = f"https://api.github.com/repos/{owner_repo}/contents/CANONICAL_COMMIT.txt?ref={mirror_sha}"
              payload = api(url)
              import base64
              return base64.b64decode(payload["content"]).decode("utf-8").strip()

          deadline = time.monotonic() + 45 * 60
          selected = None
          while time.monotonic() < deadline:
              runs = api(f"https://api.github.com/repos/{owner_repo}/actions/runs?branch=verification&per_page=100")["workflow_runs"]
              matching = []
              for run in runs:
                  if run.get("name") != "One Cross-Platform Verification":
                      continue
                  if run.get("status") != "completed" or run.get("conclusion") != "success":
                      continue
                  try:
                      if pin_for(run["head_sha"]) == source_sha:
                          matching.append(run)
                  except (OSError, ValueError, KeyError, urllib.error.HTTPError) as exc:
                      print(f"Could not resolve pin for {run.get('head_sha')}: {exc}", file=sys.stderr)
              if matching:
                  selected = sorted(matching, key=lambda r: r.get("created_at", ""), reverse=True)[0]
                  break
              print(f"Waiting for successful cross-platform bundles for source SHA {source_sha}...")
              time.sleep(30)
          if selected is None:
              raise SystemExit(f"No successful cross-platform run produced candidate bundles for exact source SHA {source_sha} within 45 minutes")

          print(f"Selected cross-platform run {selected['id']} at mirror SHA {selected['head_sha']} for source SHA {source_sha}")
          artifacts = api(f"https://api.github.com/repos/{owner_repo}/actions/runs/{selected['id']}/artifacts?per_page=100")["artifacts"]
          manifest = {}
          for platform in ("Linux", "Windows"):
              prefix = f"one-release-candidate-{platform}-{source_sha}"
              found = [a for a in artifacts if a.get("name", "").startswith(prefix) and not a.get("expired")]
              if len(found) != 1:
                  raise SystemExit(f"Expected one unexpired {platform} artifact named {prefix}*, found {len(found)}")
              artifact = found[0]
              expected_digest = artifact.get("digest", "")
              if not expected_digest.startswith("sha256:"):
                  raise SystemExit(f"GitHub artifact metadata has no SHA-256 digest for {artifact['name']}: {expected_digest}")
              manifest[platform] = {"id": artifact["id"], "name": artifact["name"], "digest": expected_digest}
              print(f"{platform}: artifact_id={artifact['id']} name={artifact['name']} digest={expected_digest}")
          pathlib.Path("artifact-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY
          mkdir -p extracted/linux extracted/windows
          for platform in Linux Windows; do
            key="$(printf '%s' "$platform" | tr '[:upper:]' '[:lower:]')"
            artifact_id="$(jq -r ".${platform}.id" artifact-manifest.json)"
            expected_digest="$(jq -r ".${platform}.digest" artifact-manifest.json | sed 's/^sha256://')"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/panglimanetizen01/one-windows-verification/actions/artifacts/${artifact_id}/zip" \
              --output "downloads/${key}-candidate.zip"
            echo "${expected_digest}  downloads/${key}-candidate.zip" | sha256sum --check
          done
          unzip -q downloads/linux-candidate.zip -d extracted/linux
          unzip -q downloads/windows-candidate.zip -d extracted/windows
          find extracted -maxdepth 3 -type f -print | sort

      - name: Verify embedded manifests, metadata, and executable formats
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import struct

          root = Path("extracted")
          source_sha = os.environ["SOURCE_SHA"]

          def one_file(folder: Path, name: str) -> Path:
              found = list(folder.rglob(name))
              if len(found) != 1:
                  raise SystemExit(f"expected exactly one {name} under {folder}, found {len(found)}")
              return found[0]

          def check_common(folder: Path, binary_name: str, expected_platform: str) -> Path:
              metadata_path = one_file(folder, "BUILD-METADATA.txt")
              sums_path = one_file(folder, "SHA256SUMS")
              metadata = {}
              for line in metadata_path.read_text(encoding="utf-8").splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      metadata[key] = value
              required = ("source_sha", "target", "rustc", "cargo", "cli_version")
              missing = [key for key in required if not metadata.get(key, "").strip()]
              if missing:
                  raise SystemExit(f"{expected_platform} missing metadata fields: {missing}")
              if metadata["source_sha"] != source_sha:
                  raise SystemExit(f"{expected_platform} source SHA mismatch: {metadata['source_sha']} != {source_sha}")
              if not metadata["target"].startswith("x86_64-"):
                  raise SystemExit(f"{expected_platform} unexpected target triple: {metadata['target']}")
              if expected_platform == "linux" and "linux" not in metadata["target"]:
                  raise SystemExit(f"Linux target triple mismatch: {metadata['target']}")
              if expected_platform == "windows" and "windows" not in metadata["target"]:
                  raise SystemExit(f"Windows target triple mismatch: {metadata['target']}")
              if "1.99.0" not in metadata["rustc"] or "1.99.0" not in metadata["cargo"]:
                  raise SystemExit(f"{expected_platform} unexpected Rust/Cargo versions: {metadata['rustc']} / {metadata['cargo']}")
              if "0.1.0" not in metadata["cli_version"]:
                  raise SystemExit(f"{expected_platform} unexpected CLI version: {metadata['cli_version']}")
              manifest = sums_path.read_text(encoding="utf-8").splitlines()
              if len(manifest) != 1:
                  raise SystemExit(f"{expected_platform} expected one binary checksum entry, got {len(manifest)}")
              expected_hash, listed_name = manifest[0].split(maxsplit=1)
              listed_name = listed_name.lstrip("* ")
              binary_path = one_file(folder, binary_name)
              if listed_name != binary_name:
                  raise SystemExit(f"{expected_platform} manifest names {listed_name}, expected {binary_name}")
              actual_hash = hashlib.sha256(binary_path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"{expected_platform} embedded SHA256SUMS mismatch: {actual_hash} != {expected_hash}")
              print(f"{expected_platform}: source_sha={metadata['source_sha']}")
              print(f"{expected_platform}: target={metadata['target']}")
              print(f"{expected_platform}: rustc={metadata['rustc']}; cargo={metadata['cargo']}")
              print(f"{expected_platform}: cli_version={metadata['cli_version']}")
              print(f"{expected_platform}: {binary_name} sha256={actual_hash}")
              return binary_path

          linux_binary = check_common(root / "linux", "one", "linux")
          linux_bytes = linux_binary.read_bytes()
          if len(linux_bytes) < 20 or linux_bytes[:4] != b"\x7fELF":
              raise SystemExit("Linux binary does not have an ELF header")
          if linux_bytes[4] != 2 or linux_bytes[5] != 1:
              raise SystemExit("Linux binary is not ELF64 little-endian")
          if struct.unpack_from("<H", linux_bytes, 18)[0] != 62:
              raise SystemExit("Linux binary e_machine is not EM_X86_64")
          print("linux: ELF64 little-endian EM_X86_64 PASS")

          windows_binary = check_common(root / "windows", "one.exe", "windows")
          windows_bytes = windows_binary.read_bytes()
          if len(windows_bytes) < 64 or windows_bytes[:2] != b"MZ":
              raise SystemExit("Windows binary does not have an MZ/PE header")
          pe_offset = struct.unpack_from("<I", windows_bytes, 0x3C)[0]
          if pe_offset + 6 > len(windows_bytes) or windows_bytes[pe_offset:pe_offset+4] != b"PE\x00\x00":
              raise SystemExit("Windows binary has an invalid PE signature")
          if struct.unpack_from("<H", windows_bytes, pe_offset + 4)[0] != 0x8664:
              raise SystemExit("Windows binary is not PE32+ x86-64")
          print("windows: PE32+ x86-64 PASS")
          PY
