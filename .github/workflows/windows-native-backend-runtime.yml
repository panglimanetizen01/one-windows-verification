name: ONE Windows Native Backend Runtime — Windows Server 2025

on:
  push:
    branches: [ verification ]
    paths:
      - "CANONICAL_COMMIT.txt"
      - ".github/workflows/windows-native-backend-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-windows-native-runtime-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-native-runtime:
    name: Build and execute exact-SHA Windows native backend
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4

      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify exact source SHA
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ steps.canonical.outputs.ref }}') { throw "canonical commit mismatch: $actual" }
          "source_sha=$actual"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install MinGW clang and linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain

      - name: Configure Windows native compiler override
        shell: pwsh
        run: |
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV
          clang --version
          x86_64-w64-mingw32-ld --version

      - name: Verify Windows Server 2025 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected AMD64 Windows runner."
          }

      - name: Build Windows native backend artifact
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          cargo run -p one-cli --bin one-native --locked -- build --target windows-x86_64 examples/hello.one one-windows-native.exe
          if (-not (Test-Path one-windows-native.exe)) {
            throw 'Windows native artifact was not produced.'
          }

      - name: Inspect PE32+ AMD64 artifact
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [System.IO.File]::ReadAllBytes('one-windows-native.exe')
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Artifact does not have a valid PE MZ header.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) {
            throw 'Invalid PE header offset.'
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            throw 'Missing PE signature.'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}." -f $machine)
          }
          Write-Host 'PE32+ AMD64 artifact verified.'

      - name: Execute Windows native artifact
        id: runtime
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & .\one-windows-native.exe 2>&1
          $exitCode = $LASTEXITCODE
          $outputText = ($output | Out-String).Trim()
          Write-Host "runtime_exit_code=$exitCode"
          Write-Host "runtime_output=$outputText"
          if ($exitCode -ne 0) {
            throw "Windows native artifact exited with code $exitCode."
          }
          if (-not $outputText.Contains('Budi')) {
            throw "Expected program output was not observed: $outputText"
          }
          "runtime_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "runtime_output=$outputText" >> $env:GITHUB_OUTPUT

      - name: Write exact-SHA runtime manifest
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash one-windows-native.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "source_sha=${{ steps.canonical.outputs.ref }}"
            "host_os=$([System.Environment]::OSVersion.VersionString)"
            "host_arch=$env:PROCESSOR_ARCHITECTURE"
            "target=x86_64-pc-windows-gnu"
            "rustc=$(rustc --version)"
            "cargo=$(cargo --version)"
            "binary=one-windows-native.exe"
            "binary_sha256=$hash"
            "runtime_exit_code=${{ steps.runtime.outputs.runtime_exit_code }}"
            "runtime_output=${{ steps.runtime.outputs.runtime_output }}"
          ) | Set-Content -Encoding utf8 one-windows-native-runtime-manifest.txt
          Get-Content one-windows-native-runtime-manifest.txt

      - name: Upload exact-SHA Windows native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-windows-native-runtime-${{ steps.canonical.outputs.ref }}
          path: |
            source/one-windows-native.exe
            source/one-windows-native-runtime-manifest.txt
          if-no-files-found: ignore
