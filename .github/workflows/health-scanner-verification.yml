name: ONE Health Scanner Exact-SHA Verification

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - 'CANDIDATE_VERIFICATION.md'
      - '.github/workflows/health-scanner-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep evidence from distinct verifier commits; a newer pin must not cancel a run
# whose logs/artifacts are still needed to classify the older candidate.
concurrency:
  group: one-health-scanner-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scanner:
    name: Health scanner tests and self-scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout verifier harness
        uses: actions/checkout@v4

      - name: Read and validate canonical source SHA (Linux)
        id: canonical_linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid canonical source SHA" >&2
            exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Read and validate canonical source SHA (Windows)
        id: canonical_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = (Get-Content CANONICAL_COMMIT.txt -Raw).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid canonical source SHA" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout exact canonical ONE source (Linux)
        id: checkout_source_linux
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical_linux.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: one-source
          persist-credentials: false

      - name: Checkout exact canonical ONE source (Windows)
        id: checkout_source_windows
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical_windows.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: one-source
          persist-credentials: false

      - name: Verify exact source checkout (Linux)
        id: verify_source_linux
        if: runner.os == 'Linux'
        working-directory: one-source
        shell: bash
        run: |
          expected="${{ steps.canonical_linux.outputs.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Verified exact source checkout: $actual"

      - name: Verify exact source checkout (Windows)
        id: verify_source_windows
        if: runner.os == 'Windows'
        working-directory: one-source
        shell: pwsh
        run: |
          $expected = "${{ steps.canonical_windows.outputs.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Source SHA mismatch: expected $expected actual $actual" }
          Write-Output "Verified exact source checkout: $actual"

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scanner regression corpus
        id: scanner_tests
        continue-on-error: true
        working-directory: one-source
        run: python -m unittest discover -s tools -p "test_one_health.py" -v

      - name: CI evidence collector regression corpus
        id: collector_tests
        continue-on-error: true
        working-directory: one-source
        run: python -m unittest discover -s tools -p "test_collect_ci_health.py" -v

      - name: Detector quality and repair outcome corpus
        id: quality_tests
        continue-on-error: true
        working-directory: one-source
        run: python -m unittest discover -s tools -p "test_health_quality.py" -v

      - name: Install stable Rust toolchain
        id: rust_setup
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable

      - name: Build ONE CLI for normative fixture checks
        id: build_cli
        continue-on-error: true
        working-directory: one-source
        run: cargo build --locked -p one-cli

      - name: Run scanner against the exact ONE checkout
        id: self_scan
        if: always()
        continue-on-error: true
        working-directory: one-source
        env:
          CANONICAL_SOURCE_SHA: ${{ runner.os == 'Linux' && steps.canonical_linux.outputs.sha || steps.canonical_windows.outputs.sha }}
        run: python tools/one_health.py --expected-sha "${{ runner.os == 'Linux' && steps.canonical_linux.outputs.sha || steps.canonical_windows.outputs.sha }}" --check-one-source --json-out one-health-report.json --markdown-out one-health-report.md

      - name: Summarize self-scan report
        if: always()
        working-directory: one-source
        env:
          CANONICAL_SOURCE_SHA: ${{ runner.os == 'Linux' && steps.canonical_linux.outputs.sha || steps.canonical_windows.outputs.sha }}
        run: python -c 'import json,os,pathlib; p=pathlib.Path("one-health-report.json"); print("EXPECTED_SOURCE_SHA=",os.environ.get("CANONICAL_SOURCE_SHA")); print("NO_REPORT_GENERATED"); sys.exit(0)' 
        shell: bash
        if: always() && runner.os == 'Linux'

      - name: Summarize self-scan report (Windows)
        if: always() && runner.os == 'Windows'
        working-directory: one-source
        env:
          CANONICAL_SOURCE_SHA: ${{ steps.canonical_windows.outputs.sha }}
        shell: pwsh
        run: |
          if (Test-Path one-health-report.json) {
            python -c 'import json; p=json.load(open("one-health-report.json", encoding="utf-8")); print("SOURCE_SHA=",p.get("head_sha")); print("SEVERITY_COUNTS=",json.dumps(p.get("severity_counts",{}),sort_keys=True)); print("DETECTORS=",json.dumps(p.get("detectors_run",[]))); [print("{} {}/{} {}:{} — {}".format(x.get("severity"),x.get("detector_id"),x.get("rule_id"),x.get("path"),x.get("line") or 0,x.get("summary"))) for x in p.get("findings",[])]'
          } else {
            Write-Output "NO_REPORT_GENERATED"
          }

      - name: Upload scanner report and source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-health-scanner-${{ matrix.os }}
          path: |
            one-source/one-health-report.json
            one-source/one-health-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce regression, build, and self-scan outcomes
        if: always()
        working-directory: one-source
        env:
          PLATFORM_NAME: ${{ runner.os }}
          CHECKOUT_LINUX: ${{ steps.checkout_source_linux.outcome }}
          CHECKOUT_WINDOWS: ${{ steps.checkout_source_windows.outcome }}
          VERIFY_LINUX: ${{ steps.verify_source_linux.outcome }}
          VERIFY_WINDOWS: ${{ steps.verify_source_windows.outcome }}
          PYTHON_SETUP: ${{ steps.python_setup.outcome }}
          SCANNER_TESTS: ${{ steps.scanner_tests.outcome }}
          COLLECTOR_TESTS: ${{ steps.collector_tests.outcome }}
          QUALITY_TESTS: ${{ steps.quality_tests.outcome }}
          RUST_SETUP: ${{ steps.rust_setup.outcome }}
          BUILD_CLI: ${{ steps.build_cli.outcome }}
          SELF_SCAN: ${{ steps.self_scan.outcome }}
        run: python -c 'import os,sys; linux=os.environ["PLATFORM_NAME"]=="Linux"; keys=["CHECKOUT_LINUX" if linux else "CHECKOUT_WINDOWS","VERIFY_LINUX" if linux else "VERIFY_WINDOWS","PYTHON_SETUP","SCANNER_TESTS","COLLECTOR_TESTS","QUALITY_TESTS","RUST_SETUP","BUILD_CLI","SELF_SCAN"]; results={k:os.environ.get(k) for k in keys}; print("REQUIRED_OUTCOMES=",results); sys.exit(0 if all(v=="success" for v in results.values()) else 1)'
