# Revalidation after Clippy-clean mount-boundary fix 2026-10-26; acceptance logic unchanged.
name: ONE E4 adversarial filesystem and resource-bound regression

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/e4-adversarial-regression.yml'
  pull_request:
    branches: [verification]
    paths:
      - '.github/workflows/e4-adversarial-regression.yml'
      - 'CANONICAL_COMMIT.txt'
      - 'evidence/triggers/prompt3-e4-adversarial.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-security-regressions:
    name: Unix no-follow and SQLite resource bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA and toolchain context
        working-directory: source
        shell: bash
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ONE_CANDIDATE_SHA"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
          rustc --version
          cargo --version
          uname -a
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Unix adversarial regressions with nonzero-test assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          run_test() {
            local expected="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            cargo test --locked -p one-core "$@" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            if [ "$rc" -ne 0 ]; then return "$rc"; fi
            if ! grep -Eq "test result: ok\\. ${expected} passed; 0 failed" "$log"; then
              echo "Expected ${expected} passing test(s); zero-match/filtered-only output is not PASS." >&2
              return 1
            fi
          }
          run_test 5 descriptor_relative_
          run_test 1 adapter::filesystem_nofollow_tests::final_component_mount_boundary_denial_does_not_truncate_file -- --exact --test-threads=1
          run_test 11 database::tests
          run_test 10 governance::tests
          run_test 1 orchestrator::tests::denied_request_never_reaches_adapter_invocation -- --exact --test-threads=1

  windows-reparse-regression:
    name: Windows reparse-point and handle checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA
        working-directory: source
        shell: pwsh
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:ONE_CANDIDATE_SHA) { throw "Unexpected source SHA: $actual (expected $env:ONE_CANDIDATE_SHA)" }
          Write-Output "source_sha=$actual"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Windows filesystem regressions with nonzero-test assertions
        working-directory: source
        shell: pwsh
        run: |
          function Invoke-ExpectedTest {
            param([string]$Filter, [int]$Expected)
            $output = & cargo test --locked -p one-core $Filter -- --exact --test-threads=1 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($exitCode -ne 0) { throw "cargo test failed for $Filter with exit code $exitCode" }
            if (($output -join "`n") -notmatch "test result: ok\. $Expected passed; 0 failed") {
              throw "Expected $Expected passing test(s) for $Filter; zero-match/filtered-only output is not PASS"
            }
          }
          Invoke-ExpectedTest "adapter::filesystem_windows_reparse_tests::filesystem_reader_rejects_directory_junction_escape" 1
          Invoke-ExpectedTest "adapter::tests::filesystem_adapter_reads_absolute_target_inside_project_root" 1
          Invoke-ExpectedTest "adapter::tests::filesystem_adapters_confine_absolute_targets_to_project_root_without_side_effects" 1
          Invoke-ExpectedTest "adapter::tests::filesystem_write_adapter_writes_text_target" 1
          Invoke-ExpectedTest "adapter::tests::filesystem_write_adapter_rejects_oversized_content" 1
          Invoke-ExpectedTest "adapter::tests::filesystem_adapters_reject_parent_directory_traversal" 1
