# Exact candidate revalidation trigger 2026-10-26; acceptance logic unchanged.
name: ONE E4 adversarial filesystem and resource-bound regression

on:
  push:
    branches: [verification]
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/e4-adversarial-regression.yml'
  pull_request:
    branches: [verification]
    paths:
      - '.github/workflows/e4-adversarial-regression.yml'
      - 'CANONICAL_COMMIT.txt'
      - 'evidence/triggers/prompt3-e4-adversarial.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-security-regressions:
    name: Unix no-follow and SQLite resource bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA and toolchain context
        working-directory: source
        shell: bash
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ONE_CANDIDATE_SHA"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
          rustc --version
          cargo --version
          uname -a
      - uses: dtolnay/rust-toolchain@stable
      - name: Run descriptor-relative no-follow adversarial regressions
        working-directory: source
        run: cargo test --locked -p one-core descriptor_relative_
      - name: Run SQLite symlink and resource-limit regressions
        working-directory: source
        run: cargo test --locked -p one-core database::tests
      - name: Run capability denial and root-scope policy regressions
        working-directory: source
        run: cargo test --locked -p one-core governance::tests
      - name: Run capability-denial side-effect regression
        working-directory: source
        run: cargo test --locked -p one-core orchestrator::tests::denied_request_never_reaches_adapter_invocation

  windows-reparse-regression:
    name: Windows reparse-point and handle checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA
        working-directory: source
        shell: pwsh
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:ONE_CANDIDATE_SHA) { throw "Unexpected source SHA: $actual (expected $env:ONE_CANDIDATE_SHA)" }
          Write-Output "source_sha=$actual"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Windows reparse-point regression
        working-directory: source
        run: cargo test --locked -p one-core filesystem_windows_reparse_tests
