# Revalidation after Clippy-clean mount-boundary fix 2026-10-26; acceptance logic unchanged.
name: ONE E4 adversarial filesystem and resource-bound regression

on:
  push:
    branches: [verification, 'probe/**']
    paths:
      - 'CANONICAL_COMMIT.txt'
      - '.github/workflows/e4-adversarial-regression.yml'
  pull_request:
    branches: [verification]
    paths:
      - '.github/workflows/e4-adversarial-regression.yml'
      - 'CANONICAL_COMMIT.txt'
      - 'evidence/triggers/prompt3-e4-adversarial.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-security-regressions:
    name: Unix no-follow and SQLite resource bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA and toolchain context
        working-directory: source
        shell: bash
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ONE_CANDIDATE_SHA"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
          rustc --version
          cargo --version
          uname -a
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Run Unix adversarial regressions with nonzero-test assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          run_test() {
            local expected="$1"
            local filter="$2"
            shift 2
            local log
            log="$(mktemp)"
            set +e
            cargo test --locked -p one-core -- "$filter" "$@" 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            set -e
            if [ "$rc" -ne 0 ]; then return "$rc"; fi
            local matched
            matched="$(grep -F "$filter" "$log" | grep -E '^test .* \.\.\. ok$' | wc -l | tr -d ' ')"
            if [ "$matched" -ne "$expected" ]; then
              echo "Expected $expected passing test line(s) matching '$filter'; observed $matched. Filtered-only output is not PASS." >&2
              return 1
            fi
          }
          run_test 2 descriptor_relative_read_rejects_
          run_test 1 descriptor_relative_write_rejects_
          run_test 1 descriptor_relative_walk_rejects_
          run_test 1 adapter::filesystem_nofollow_tests::descriptor_relative_read_race_never_follows_swapped_parent_symlink --exact --test-threads=1
          run_test 1 adapter::filesystem_nofollow_tests::final_component_mount_boundary_denial_does_not_truncate_file --exact --test-threads=1
          run_test 11 database::tests
          run_test 10 governance::tests
          run_test 27 network_runtime::tests -- --test-threads=1
          run_test 1 orchestrator::tests::denied_request_never_reaches_adapter_invocation --exact --test-threads=1

  windows-reparse-regression:
    name: Windows reparse-point and handle checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.candidate.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify source SHA
        working-directory: source
        shell: pwsh
        env:
          ONE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:ONE_CANDIDATE_SHA) { throw "Unexpected source SHA: $actual (expected $env:ONE_CANDIDATE_SHA)" }
          Write-Output "source_sha=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Run Windows filesystem regressions with nonzero-test assertions
        working-directory: source
        shell: pwsh
        run: |
          function Invoke-ExpectedTest {
            param([string]$Filter)
            $output = & cargo test --locked -p one-core -- $Filter --test-threads=1 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($exitCode -ne 0) { throw "cargo test failed for $Filter with exit code $exitCode" }
            $joined = $output -join "`n"
            if ($joined -notmatch [regex]::Escape($Filter) -or
                $joined -notmatch "running 1 test" -or
                $joined -notmatch "test result: ok\. 1 passed; 0 failed") {
              throw "Expected the named test to execute exactly once and pass for $Filter. Filtered-only output is not PASS"
            }
          }
          Invoke-ExpectedTest "filesystem_reader_rejects_directory_junction_escape"
          Invoke-ExpectedTest "filesystem_adapter_reads_absolute_target_inside_project_root"
          Invoke-ExpectedTest "filesystem_adapters_confine_absolute_targets_to_project_root_without_side_effects"
          Invoke-ExpectedTest "filesystem_write_adapter_writes_text_target"
          Invoke-ExpectedTest "filesystem_write_adapter_rejects_oversized_content"
          Invoke-ExpectedTest "filesystem_adapters_reject_parent_directory_traversal"


  windows-obj-dont-reparse-contract-probe:
    name: Windows user-mode NtCreateFile OBJ_DONT_REPARSE contract probe
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/probe/')
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Probe RootDirectory-relative opens and junction rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class OneNtCreateFileProbe {
              const uint OBJ_CASE_INSENSITIVE = 0x00000040;
              const uint OBJ_DONT_REPARSE = 0x00001000;
              const uint FILE_LIST_DIRECTORY = 0x00000001;
              const uint FILE_TRAVERSE = 0x00000020;
              const uint FILE_READ_ATTRIBUTES = 0x00000080;
              const uint SYNCHRONIZE = 0x00100000;
              const uint FILE_SHARE_READ = 0x00000001;
              const uint FILE_SHARE_WRITE = 0x00000002;
              const uint OPEN_EXISTING = 3;
              const uint FILE_FLAG_BACKUP_SEMANTICS = 0x02000000;
              const uint FILE_OPEN = 1;
              const uint FILE_DIRECTORY_FILE = 0x00000001;
              const uint FILE_SYNCHRONOUS_IO_NONALERT = 0x00000020;
              const uint FILE_ATTRIBUTE_NORMAL = 0x00000080;
              public const int STATUS_REPARSE_POINT_ENCOUNTERED = unchecked((int)0xC000050B);

              [StructLayout(LayoutKind.Sequential)]
              struct UNICODE_STRING {
                  public ushort Length;
                  public ushort MaximumLength;
                  public IntPtr Buffer;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct OBJECT_ATTRIBUTES {
                  public int Length;
                  public IntPtr RootDirectory;
                  public IntPtr ObjectName;
                  public uint Attributes;
                  public IntPtr SecurityDescriptor;
                  public IntPtr SecurityQualityOfService;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct IO_STATUS_BLOCK {
                  public IntPtr Status;
                  public IntPtr Information;
              }

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, EntryPoint = "CreateFileW")]
              static extern IntPtr CreateFile(string name, uint access, uint share, IntPtr security,
                  uint creation, uint flags, IntPtr template);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool CloseHandle(IntPtr handle);

              [DllImport("ntdll.dll")]
              static extern int NtClose(IntPtr handle);

              [DllImport("ntdll.dll")]
              static extern int NtCreateFile(out IntPtr fileHandle, uint desiredAccess,
                  ref OBJECT_ATTRIBUTES objectAttributes, out IO_STATUS_BLOCK ioStatusBlock,
                  IntPtr allocationSize, uint fileAttributes, uint shareAccess,
                  uint createDisposition, uint createOptions, IntPtr eaBuffer, uint eaLength);

              static int OpenNamedDirectory(string name, IntPtr root, uint objectAttributes, out IntPtr handle) {
                  IntPtr nameBuffer = Marshal.StringToHGlobalUni(name);
                  IntPtr unicodeBuffer = IntPtr.Zero;
                  try {
                      var unicode = new UNICODE_STRING {
                          Length = checked((ushort)(name.Length * 2)),
                          MaximumLength = checked((ushort)(name.Length * 2 + 2)),
                          Buffer = nameBuffer
                      };
                      unicodeBuffer = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(UNICODE_STRING)));
                      Marshal.StructureToPtr(unicode, unicodeBuffer, false);
                      var attributes = new OBJECT_ATTRIBUTES {
                          Length = Marshal.SizeOf(typeof(OBJECT_ATTRIBUTES)),
                          RootDirectory = root,
                          ObjectName = unicodeBuffer,
                          Attributes = objectAttributes
                      };
                      IO_STATUS_BLOCK io;
                      return NtCreateFile(out handle,
                          FILE_LIST_DIRECTORY | FILE_TRAVERSE | FILE_READ_ATTRIBUTES | SYNCHRONIZE,
                          ref attributes, out io, IntPtr.Zero, FILE_ATTRIBUTE_NORMAL,
                          FILE_SHARE_READ | FILE_SHARE_WRITE, FILE_OPEN,
                          FILE_DIRECTORY_FILE | FILE_SYNCHRONOUS_IO_NONALERT,
                          IntPtr.Zero, 0);
                  } finally {
                      if (unicodeBuffer != IntPtr.Zero) Marshal.FreeHGlobal(unicodeBuffer);
                      Marshal.FreeHGlobal(nameBuffer);
                  }
              }

              public static IntPtr OpenRoot(string path) {
                  IntPtr handle;
                  string nativePath = @"\??\" + System.IO.Path.GetFullPath(path);
                  int status = OpenNamedDirectory(nativePath, IntPtr.Zero, OBJ_CASE_INSENSITIVE, out handle);
                  if (status != 0) {
                      string hex = "0x" + unchecked((uint)status).ToString("X8");
                      throw new InvalidOperationException("NtCreateFile trusted-root open failed: " + hex);
                  }
                  return handle;
              }

              public static int OpenDirectoryRelative(IntPtr root, string component, out IntPtr handle) {
                  return OpenNamedDirectory(component, root, OBJ_CASE_INSENSITIVE | OBJ_DONT_REPARSE, out handle);
              }

              public static void CloseNt(IntPtr handle) {
                  if (handle != IntPtr.Zero && handle != new IntPtr(-1)) NtClose(handle);
              }

              public static void CloseWin32(IntPtr handle) {
                  if (handle != IntPtr.Zero && handle != new IntPtr(-1)) CloseHandle(handle);
              }
          }
'@

          $root = Join-Path $env:RUNNER_TEMP ("one-obj-dont-reparse-" + [guid]::NewGuid().ToString("N"))
          $outside = Join-Path $env:RUNNER_TEMP ("one-obj-dont-reparse-outside-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          New-Item -ItemType Directory -Path $outside | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "ordinary") | Out-Null
          $junction = Join-Path $root "junction"
          & cmd.exe /c mklink /J "$junction" "$outside"
          if ($LASTEXITCODE -ne 0) { throw "Could not create test junction; exit=$LASTEXITCODE" }

          $rootHandle = [OneNtCreateFileProbe]::OpenRoot($root)
          $ordinaryHandle = [IntPtr]::Zero
          $junctionHandle = [IntPtr]::Zero
          try {
            $ordinaryStatus = [OneNtCreateFileProbe]::OpenDirectoryRelative($rootHandle, "ordinary", [ref]$ordinaryHandle)
            if ($ordinaryStatus -ne 0) {
              $hex = "0x{0:X8}" -f ([uint32]$ordinaryStatus)
              throw "Control open of ordinary child failed with NTSTATUS $hex; OBJ_DONT_REPARSE RootDirectory contract not usable"
            }
            [OneNtCreateFileProbe]::CloseNt($ordinaryHandle)
            $ordinaryHandle = [IntPtr]::Zero

            $junctionStatus = [OneNtCreateFileProbe]::OpenDirectoryRelative($rootHandle, "junction", [ref]$junctionHandle)
            $hex = "0x{0:X8}" -f ([uint32]$junctionStatus)
            Write-Output "ordinary_child_status=0x00000000"
            Write-Output "junction_child_status=$hex"
            if ($junctionStatus -eq 0) {
              [OneNtCreateFileProbe]::CloseNt($junctionHandle)
              $junctionHandle = [IntPtr]::Zero
              throw "SECURITY FAILURE: OBJ_DONT_REPARSE allowed a RootDirectory-relative open of a junction"
            }
            if ($junctionStatus -ne [OneNtCreateFileProbe]::STATUS_REPARSE_POINT_ENCOUNTERED) {
              throw "INCONCLUSIVE/UNSUPPORTED: expected STATUS_REPARSE_POINT_ENCOUNTERED, observed $hex"
            }
            Write-Output "OBJ_DONT_REPARSE_ROOT_DIRECTORY_JUNCTION_DENIAL_OK"
          } finally {
            [OneNtCreateFileProbe]::CloseNt($ordinaryHandle)
            [OneNtCreateFileProbe]::CloseNt($junctionHandle)
            [OneNtCreateFileProbe]::CloseNt($rootHandle)
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $outside -Recurse -Force -ErrorAction SilentlyContinue
          }
