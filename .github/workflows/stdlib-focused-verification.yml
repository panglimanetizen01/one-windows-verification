name: ONE Focused Standard Library and Database Verification

on:
  push:
    branches: [ verification ]
    paths:
      - "CANONICAL_COMMIT.txt"
      - ".github/workflows/stdlib-focused-verification.yml"
  pull_request:
    branches: [ verification ]
    paths:
      - "CANONICAL_COMMIT.txt"
      - ".github/workflows/stdlib-focused-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-stdlib-focused-v0.1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  stdlib:
    name: Documented v0.1 standard library and database regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - name: Read exact Rust toolchain from pinned source
        id: source_toolchain
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable Rust channel in rust-toolchain.toml: $channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Using exact source-pinned Rust toolchain: $channel"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.source_toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source
      - name: Print exact source and toolchain
        working-directory: source
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Documented standard-library helper unit tests
        working-directory: source
        run: cargo --locked test -p one-core --lib stdlib::tests -- --test-threads=1
      - name: Source-language core pipeline and list operations
        working-directory: source
        run: cargo --locked test -p one-core --test core_pipeline
      - name: v0.1 conformance fixtures
        working-directory: source
        run: cargo --locked test -p one-core --test conformance
      - name: SQLite adapter unit contract
        working-directory: source
        run: cargo --locked test -p one-core --lib database::tests -- --test-threads=1
      - name: SQLite language-level database vertical slice
        working-directory: source
        run: cargo --locked test -p one-core --test database_vertical_slice
      - name: Complete one-core library unit suite
        working-directory: source
        run: cargo --locked test -p one-core --lib -- --test-threads=1
      - name: one-core Clippy with warnings denied
        working-directory: source
        run: cargo --locked clippy -p one-core --all-targets -- -D warnings
      - name: Repository contract checker
        working-directory: source
        run: python tools/check_contract.py
