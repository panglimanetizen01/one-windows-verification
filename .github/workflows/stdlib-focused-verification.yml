name: ONE Focused Standard Library and Database Verification

on:
  push:
    branches: [ verification ]
    paths:
      - "CANONICAL_COMMIT.txt"
      - ".github/workflows/stdlib-focused-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-stdlib-focused-v2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  stdlib:
    name: UTC and database resource-bound regressions (canonical source SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical source SHA
        id: canonical
        shell: bash
        run: |
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid canonical commit: $target" >&2
            exit 1
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.canonical.outputs.ref }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Verify exact source SHA
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.ref }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: UTC formatter unit and calendar-boundary tests
        working-directory: source
        run: cargo --locked test -p one-core --lib unix_seconds_format_as_valid_bounded_gregorian_utc_timestamps
      - name: JSON serializer byte-budget boundary tests
        working-directory: source
        run: cargo --locked test -p one-core --lib json_serializer_enforces_the_utf8_output_byte_limit
      - name: Source-level UTC formatter integration tests
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins unix_timestamp_formatter_runs_through_the_canonical_pipeline
      - name: Source-level text prefix and suffix integration tests
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins text_prefix_and_suffix_builtins_execute_through_the_canonical_pipeline
      - name: Source-level checked integer remainder integration tests
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins checked_integer_remainder_runs_through_the_canonical_pipeline
      - name: Source-level case conversion and numeric integration tests
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins case_conversion_and_numeric_builtins_execute_through_the_canonical_pipeline
      - name: UTC parser unit and calendar-validation tests
        working-directory: source
        run: cargo --locked test -p one-core --lib utc_text_parses_strict_bounded_gregorian_timestamps
      - name: Source-level UTC parser integration tests
        working-directory: source
        run: cargo --locked test -p one-core --test stdlib_builtins utc_timestamp_parser_runs_through_the_canonical_pipeline
      - name: SQLite SQL byte-limit regression
        working-directory: source
        run: cargo --locked test -p one-core --lib sqlite_adapter_rejects_sql_over_query_byte_limit
      - name: SQLite individual parameter byte-limit regression
        working-directory: source
        run: cargo --locked test -p one-core --lib sqlite_adapter_rejects_individually_oversized_parameters
      - name: SQLite parameter-count regression
        working-directory: source
        run: cargo --locked test -p one-core --lib sqlite_adapter_rejects_excessive_parameter_count
      - name: SQLite aggregate parameter byte-limit regression
        working-directory: source
        run: cargo --locked test -p one-core --lib sqlite_adapter_rejects_aggregate_parameter_bytes_over_the_limit
      - name: SQLite read-only missing-file regression
        working-directory: source
        run: cargo --locked test -p one-core --test database_vertical_slice sqlite_read_query_does_not_create_missing_database_file
      - name: Built package signing and trusted-publisher verification
        working-directory: source
        run: cargo --locked test -p one-cli --test cli package_signature_cli_authenticates_trusted_publisher_and_detects_tampering -- --exact
      - name: Standard-library lint
        working-directory: source
        run: cargo --locked clippy -p one-core --all-targets -- -D warnings
