name: ONE Android AArch64 runtime — TCG retry

on:
  push:
    branches: [verification]
    paths:
      - '.github/workflows/android-aarch64-tcg-fallback-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aarch64-tcg:
    name: API 35 arm64-v8a ELF runtime
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned ONE source
        uses: actions/checkout@v4
        with:
          repository: panglimanetizen01/one
          ref: 25dfbb6aa5bffd7049bf7228f0da190cb2520177
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source

      - name: Verify exact SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "25dfbb6aa5bffd7049bf7228f0da190cb2520177"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and API 35 AArch64 emulator
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "emulator" "platform-tools" "system-images;android-35;default;arm64-v8a"
          clang="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit)"
          test -x "$clang"
          echo "ONE_ANDROID_CLANG=$clang" >> "$GITHUB_ENV"

      - name: Android backend contract tests
        working-directory: source
        run: cargo test --locked -p one-core --test native_backend_android_aarch64

      - name: Boot Android API 35 AArch64 with TCG
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          devices="$("$avdmanager" list device)"
          device_id="$(printf '%s\n' "$devices" | sed -n 's/.*id: [0-9][0-9]* or "\([^"]*\)".*/\1/p' | grep -m1 '^pixel' || true)"
          test -n "$device_id"
          printf 'no\n' | "$avdmanager" create avd --force --name one-api35-arm64-tcg --package "system-images;android-35;default;arm64-v8a" --device "$device_id"
          # The hosted macOS VM lacks nested HVF. Interpose a diagnostic wrapper around the emulator's QEMU binary and replace every HVF/off accelerator request with TCG.
          qemu_bin="$ANDROID_HOME/emulator/qemu/darwin-aarch64/qemu-system-aarch64-headless"
          qemu_real="$RUNNER_TEMP/qemu-system-aarch64-headless.real"
          test -x "$qemu_bin"
          mv "$qemu_bin" "$qemu_real"
          export ONE_QEMU_REAL="$qemu_real"
          cat > "$qemu_bin" <<'ONE_QEMU_WRAPPER'
          #!/bin/bash
          set -euo pipefail
          printf 'ONE_QEMU_TCG_WRAPPER_CALLED=1\\n' >&2
          args=()
          while (($#)); do
            arg="$1"
            shift
            case "$arg" in
              -enable-hvf) args+=("-accel" "tcg") ;;
              -accel)
                if (($#)); then
                  accel="$1"
                  shift
                  if [[ "$accel" == "hvf" || "$accel" == "off" ]]; then
                    args+=("-accel" "tcg")
                  else
                    args+=("-accel" "$accel")
                  fi
                else
                  args+=("-accel")
                fi
                ;;
              -accel=hvf|-accel=off) args+=("-accel=tcg") ;;
              *) args+=("$arg") ;;
            esac
          done
          printf 'ONE_QEMU_TCG_FILTERED_ARGS=%s\\n' "${args[*]}" >&2
          exec "$ONE_QEMU_REAL" "${args[@]}"
          ONE_QEMU_WRAPPER
          chmod +x "$qemu_bin"
          log="$RUNNER_TEMP/one-android-tcg.log"
          "$ANDROID_HOME/emulator/emulator" -accel off -avd one-api35-arm64-tcg -port 5554 -no-window -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 2048 -cores 2 -gpu swiftshader_indirect -verbose >"$log" 2>&1 &
          pid=$!
          adb start-server
          booted=0
          for attempt in $(seq 1 180); do
            if ! kill -0 "$pid" 2>/dev/null; then tail -n 250 "$log"; exit 1; fi
            if adb devices | tr -d '\r' | grep -q '^emulator-5554[[:space:]]\+device$'; then
              [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ] && booted=1 && break
            fi
            sleep 10
          done
          if [ "$booted" != "1" ]; then tail -n 300 "$log"; adb devices -l || true; exit 1; fi
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
          test "$(adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
          echo "ONE_ANDROID_ADB=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"

      - name: Build and execute AArch64 ELF on Android
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export ONE_ANDROID_ADB="$ANDROID_HOME/platform-tools/adb"
          "$ONE_ANDROID_CLANG" --version
          cargo --locked test -p one-core --test native_backend_android_aarch64 build_native_menghasilkan_dan_menjalankan_elf_android_aarch64 -- --ignored --exact --nocapture

      - name: Upload API 35 TCG runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-android-api35-macos-tcg-${{ github.sha }}
          path: |
            ${{ runner.temp }}/one-android-tcg.log
            ${{ runner.temp }}/one-android-avd-list.txt
          if-no-files-found: warn
          retention-days: 30
