name: Prompt 3 rustfmt-normalized source export

on:
  push:
    branches: [verification]
    paths:
      - '.github/workflows/e3-e4-format-export.yml'

permissions:
  contents: write

jobs:
  export-normalized-source:
    name: Export formatted interop.rs for review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve exact candidate SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '\r\n[:space:]' < CANONICAL_COMMIT.txt)"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - name: Checkout exact ONE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panglimanetizen01/one
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.CANONICAL_READ_TOKEN }}
          path: source
      - name: Normalize and verify scoped Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 source/crates/one-core/src/interop.rs
          rustfmt --edition 2024 --check source/crates/one-core/src/interop.rs
      - name: Export normalized source snapshot
        shell: bash
        env:
          ONE_CANDIDATE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generated
          cp source/crates/one-core/src/interop.rs evidence/generated/interop-rustfmt-normalized.rs
          printf '%s\n' "$ONE_CANDIDATE_SHA" > evidence/generated/interop-rustfmt-source-sha.txt
          branch="evidence/interop-rustfmt-${ONE_CANDIDATE_SHA:0:8}"
          verify_existing_branch() {
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_source_sha="$(git show "refs/remotes/origin/$branch:evidence/generated/interop-rustfmt-source-sha.txt" | tr -d '\r\n[:space:]')"
            if [[ "$remote_source_sha" != "$ONE_CANDIDATE_SHA" ]]; then
              echo "Existing evidence branch is pinned to a different source SHA: $remote_source_sha" >&2
              return 1
            fi
            git show "refs/remotes/origin/$branch:evidence/generated/interop-rustfmt-normalized.rs" | cmp -s - evidence/generated/interop-rustfmt-normalized.rs
            echo "Existing evidence branch already contains the exact source SHA and identical rustfmt output; idempotent success."
            echo "EXISTING_EVIDENCE_BRANCH=$branch"
            echo "EXISTING_EVIDENCE_COMMIT=$(git rev-parse "refs/remotes/origin/$branch")"
          }
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            verify_existing_branch
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add evidence/generated/interop-rustfmt-normalized.rs evidence/generated/interop-rustfmt-source-sha.txt
          git commit -m "evidence: export rustfmt-normalized interop.rs for $ONE_CANDIDATE_SHA"
          if ! git push origin "HEAD:refs/heads/$branch"; then
            echo "Evidence branch creation raced with another run; verify the remote branch content."
            verify_existing_branch
          fi
